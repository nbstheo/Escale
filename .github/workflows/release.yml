name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release

      - name: Publier Escale.exe
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          Copy-Item target\release\escale.exe Escale.exe
          $sha = (Get-FileHash Escale.exe -Algorithm SHA256).Hash.ToLower()
          $notes = "Télécharger **Escale.exe** et le lancer, rien à installer.`n`nSHA-256 : ``$sha``"
          gh release create $env:TAG Escale.exe --title "Escale $($env:TAG.TrimStart('v'))" --notes $notes
