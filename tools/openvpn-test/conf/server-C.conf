# Profil C : TCP 11444, CBC uniquement (chemin legacy AES-256-CBC + HMAC SHA256)
port 11444
proto tcp-server
dev tun
ca /etc/openvpn/pki/ca.crt
cert /etc/openvpn/pki/server.crt
key /etc/openvpn/pki/server.key
dh none
tls-auth /etc/openvpn/pki/ta.key 0
auth SHA256
data-ciphers AES-256-CBC
data-ciphers-fallback AES-256-CBC
comp-lzo
allow-compression asym
script-security 2
auth-user-pass-verify /etc/openvpn/conf/verify.sh via-file
topology subnet
server 10.10.0.0 255.255.255.0
push "route 192.168.102.0 255.255.255.0"
push "dhcp-option DNS 10.10.0.1"
keepalive 10 60
reneg-sec 3600
verb 4
