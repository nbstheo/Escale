      <g fill="#000">
        <rect x="236" y="127" width="48" height="8" rx="4"/><rect x="298" y="127" width="30" height="8" rx="4"/>
        <rect x="236" y="251" width="34" height="8" rx="4"/>
        <rect x="236" y="375" width="48" height="8" rx="4"/><rect x="298" y="375" width="30" height="8" rx="4"/>
      </g>
    </mask>
  </defs>
  <polygon mask="url(#marquage)" fill="url(#accent)" stroke="url(#accent)" stroke-width="20" stroke-linejoin="round"
    points="130,106 388,106 360,158 206,158 206,230 332,230 304,282 206,282 206,354 388,354 360,406 130,406"/>
